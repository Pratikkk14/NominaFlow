events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression for high-performance static delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream fastapi_app {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Client body limit for multipart document uploads (5MB)
        client_max_body_size 10M;

        # Static assets cache and direct serving
        location /static/ {
            alias /app/src/training_nomination/static/;
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }

        # Reverse proxy to FastAPI application
        location / {
            proxy_pass http://fastapi_app;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support if required
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check bypass
        location /health {
            proxy_pass http://fastapi_app/health;
            access_log off;
        }
    }
}
