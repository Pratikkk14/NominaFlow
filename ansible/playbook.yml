---
# ==============================================================================
# NominaFlow - Infrastructure Configuration & Automated Deployment Playbook
# Weeks 13-14: Ansible Configuration Management & Self-Healing Orchestration
# ==============================================================================

- name: Provision and Deploy NominaFlow Application Stack
  hosts: all
  become: true
  gather_facts: true

  vars:
    app_root: "/opt/nominaflow"
    app_user: "nominaflow"
    app_group: "nominaflow"
    deploy_env: "{{ env | default('production') }}"
    db_password: "{{ lookup('env', 'DB_PASSWORD') | default('NominaFlowSecurePass2026!', true) }}"
    jwt_secret: "{{ lookup('env', 'JWT_SECRET_KEY') | default('NominaFlow_Ansible_AutoGenerated_Secret_Key_2026', true) }}"
    healthcheck_url: "http://localhost/health"
    max_healthcheck_retries: 12
    healthcheck_delay: 5

  tasks:
    # --------------------------------------------------------------------------
    # Phase 1: Host System Hardening & Prerequisites
    # --------------------------------------------------------------------------
    - name: Ensure required OS packages are installed
      ansible.builtin.package:
        name:
          - curl
          - git
          - ca-certificates
          - gnupg
          - lsb-release
          - python3
          - python3-pip
          - rsyslog
        state: present

    - name: Create dedicated system group for NominaFlow
      ansible.builtin.group:
        name: "{{ app_group }}"
        state: present
        system: true

    - name: Create dedicated system user for NominaFlow
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        groups:
          - docker
        append: true
        system: true
        shell: /bin/bash
        home: "{{ app_root }}"
        create_home: true
        state: present

    - name: Ensure application and log directories exist with secure permissions
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0750'
      loop:
        - "{{ app_root }}"
        - "{{ app_root }}/nginx"
        - "{{ app_root }}/logs"
        - "{{ app_root }}/reports"
        - "/var/log/nominaflow"

    # --------------------------------------------------------------------------
    # Phase 2: Configuration & Environment Deployment
    # --------------------------------------------------------------------------
    - name: Deploy production environment file (.env)
      ansible.builtin.template:
        src: templates/env.j2
        dest: "{{ app_root }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0600'
      when: lookup('ansible.builtin.file', 'templates/env.j2', errors='ignore') != ''

    - name: Ensure direct .env fallback if template is not present
      ansible.builtin.copy:
        dest: "{{ app_root }}/.env"
        content: |
          ENVIRONMENT={{ deploy_env }}
          DEBUG=False
          DATABASE_URL=postgresql+asyncpg://postgres:{{ db_password }}@db:5432/nominaflow_db
          JWT_SECRET_KEY={{ jwt_secret }}
          ACCESS_TOKEN_EXPIRE_MINUTES=480
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0600'

    - name: Deploy application docker-compose.yml
      ansible.builtin.copy:
        src: ../docker-compose.yml
        dest: "{{ app_root }}/docker-compose.yml"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0640'

    - name: Deploy Nginx reverse proxy configuration
      ansible.builtin.copy:
        src: ../nginx/nginx.conf
        dest: "{{ app_root }}/nginx/nginx.conf"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0644'

    # --------------------------------------------------------------------------
    # Phase 3: Systemd Daemon Setup & Lifecycle Management
    # --------------------------------------------------------------------------
    - name: Deploy NominaFlow systemd service unit
      ansible.builtin.copy:
        src: nominaflow.service
        dest: /etc/systemd/system/nominaflow.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - Reload systemd daemon
        - Restart nominaflow service

    - name: Flush handlers to ensure systemd is reloaded immediately
      ansible.builtin.meta: flush_handlers

    - name: Enable and start NominaFlow systemd service
      ansible.builtin.systemd:
        name: nominaflow
        enabled: true
        state: started

    # --------------------------------------------------------------------------
    # Phase 4: Zero-Downtime Health Check & Idempotency Validation
    # --------------------------------------------------------------------------
    - name: Verify application stack health status via Nginx proxy (/health)
      ansible.builtin.uri:
        url: "{{ healthcheck_url }}"
        method: GET
        status_code: 200
        return_content: true
      register: health_response
      until: health_response.status == 200 and ('"status":"healthy"' in health_response.content or '"status": "healthy"' in health_response.content)
      retries: "{{ max_healthcheck_retries }}"
      delay: "{{ healthcheck_delay }}"

    - name: Log deployment verification summary
      ansible.builtin.debug:
        msg: >-
          NominaFlow {{ app_version }} successfully deployed to {{ inventory_hostname }}.
          Healthcheck response: {{ health_response.json }}

  handlers:
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart nominaflow service
      ansible.builtin.systemd:
        name: nominaflow
        state: restarted
