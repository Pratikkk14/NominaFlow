{% extends "base.html" %}

{% block title %}Login — NominaFlow{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 2rem auto;">
  <div class="card">
    <div class="card-header" style="justify-content: center; text-align: center; flex-direction: column; gap: 0.5rem;">
      <h1 class="card-title" style="font-size: 1.5rem;">🔐 System Login</h1>
      <p style="font-size: 0.875rem; color: var(--text-muted);">Training Nomination Workflow Portal</p>
    </div>

    <form id="loginForm" onsubmit="submitLogin(event)">
      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" class="input-text" required placeholder="user@nominaflow.com">
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" class="input-text" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Log In</button>
    </form>

    <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border);">
      <p style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.75rem; text-align: center;">
        ⚡ Instant Viva / Demo Personas
      </p>
      <div style="display: flex; flex-direction: column; gap: 0.5rem;">
        <button type="button" onclick="quickLogin('employee@nominaflow.com', 'password123')" class="btn btn-secondary btn-sm" style="justify-content: flex-start;">
          👤 Alex Mercer <span class="role-tag employee" style="margin-left: auto;">Employee</span>
        </button>
        <button type="button" onclick="quickLogin('reviewer@nominaflow.com', 'password123')" class="btn btn-secondary btn-sm" style="justify-content: flex-start;">
          🔍 Sarah Jenkins <span class="role-tag reviewer" style="margin-left: auto;">Reviewer</span>
        </button>
        <button type="button" onclick="quickLogin('admin@nominaflow.com', 'password123')" class="btn btn-secondary btn-sm" style="justify-content: flex-start;">
          👑 Admin User <span class="role-tag admin" style="margin-left: auto;">Administrator</span>
        </button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  async function submitLogin(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;

    try {
      const data = await apiCall('/api/v1/auth/login', 'POST', { email, password });
      showToast(`Welcome back, ${data.name}!`, 'success');
      
      // Redirect based on user role
      if (data.role === 'EMPLOYEE') {
        window.location.href = '/employee';
      } else if (data.role === 'REVIEWER') {
        window.location.href = '/reviewer';
      } else if (data.role === 'ADMIN') {
        window.location.href = '/admin';
      } else {
        window.location.href = '/';
      }
    } catch (err) {
      showToast(err.message, 'danger');
    }
  }
</script>
{% endblock %}
